name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Format and Test
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Automated Tests
        run: pytest -q

  docker-smoke:
    name: Docker Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: docker build -t boardbridge .

      - name: Start Docker Container
        run: docker run -d --name boardbridge -p 8000:8000 -e LLM_PROVIDER=fake boardbridge

      - name: Wait for API and Check Endpoints
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up after $i seconds"
              break
            fi
            sleep 1
          done
          echo "Checking /health endpoint..."
          curl -fsS http://localhost:8000/health
          echo -e "\nChecking /ready endpoint..."
          curl -fsS http://localhost:8000/ready

      - name: Print Docker Logs on Failure
        if: failure()
        run: docker logs boardbridge
