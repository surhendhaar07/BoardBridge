services:
  db:
    image: pgvector/pgvector:pg16
    container_name: boardbridge-db
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - boardbridge-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boardbridge-api
    environment:
      - DATABASE_URL=postgresql://app:app@db:5432/rag
      - LLM_PROVIDER=${LLM_PROVIDER:-fake}
      - ENVIRONMENT=local
      - PORT=8000
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - boardbridge-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  boardbridge-net:
    driver: bridge

